name: AsantePDF Development Windows Gate

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  windows-build:
    if: github.head_ref == 'development/master-upgrade-v2'
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out master-upgrade branch
        uses: actions/checkout@v4
        with:
          ref: development/master-upgrade-v2
          fetch-depth: 0

      - name: Apply staged development patches
        shell: pwsh
        run: |
          $patchRoot = Join-Path $env:GITHUB_WORKSPACE 'dev-patches'
          if (-not (Test-Path $patchRoot)) {
            Write-Host 'No staged development patches. Building branch as committed.' -ForegroundColor Cyan
            exit 0
          }

          $patches = Get-ChildItem $patchRoot -Filter '*.ps1' -File | Sort-Object Name
          foreach ($patch in $patches) {
            Write-Host "Applying $($patch.Name)..." -ForegroundColor Cyan
            & $patch.FullName -SourceRoot $env:GITHUB_WORKSPACE
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Set up exact .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.202'

      - name: Restore and compile x64 Release
        shell: pwsh
        run: |
          $sdk = dotnet --version
          Write-Host "Selected .NET SDK: $sdk"
          if ($sdk -ne '10.0.202') { throw "Expected .NET SDK 10.0.202, got $sdk" }
          dotnet restore ./AsantePDF.sln
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build ./AsantePDF.sln -c Release -p:Platform=x64 --no-restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run core smoke tests
        shell: pwsh
        run: |
          dotnet run --project ./tests/PdfRescue.SmokeTests/PdfRescue.SmokeTests.csproj -c Release --no-build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Commit validated generated changes
        shell: pwsh
        run: |
          if (-not (Test-Path 'dev-patches')) {
            Write-Host 'No generated patch changes to commit.' -ForegroundColor Cyan
            exit 0
          }

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src
          git rm -r dev-patches
          if (git diff --cached --quiet) {
            Write-Host 'Patch scripts produced no repository changes.' -ForegroundColor Cyan
            exit 0
          }
          git commit -m 'Apply Windows-validated AsantePDF development patch'
          git push origin HEAD:development/master-upgrade-v2
