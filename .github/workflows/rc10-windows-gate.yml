name: AsantePDF Development Windows Gate

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - 'development/master-upgrade-v2'

permissions:
  contents: write

concurrency:
  group: asantepdf-development-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows-build:
    if: github.head_ref == 'development/master-upgrade-v2' || github.ref == 'refs/heads/development/master-upgrade-v2'
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out master-upgrade branch
        uses: actions/checkout@v4
        with:
          ref: development/master-upgrade-v2
          fetch-depth: 0

      - name: Apply staged development patches
        shell: pwsh
        run: |
          $patchRoot = Join-Path $env:GITHUB_WORKSPACE 'dev-patches'
          if (-not (Test-Path $patchRoot)) {
            Write-Host 'No staged development patches. Building branch as committed.' -ForegroundColor Cyan
            exit 0
          }

          $patches = Get-ChildItem $patchRoot -Filter '*.ps1' -File | Sort-Object Name
          foreach ($patch in $patches) {
            Write-Host "Applying $($patch.Name)..." -ForegroundColor Cyan
            $global:LASTEXITCODE = 0
            & $patch.FullName -SourceRoot $env:GITHUB_WORKSPACE
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Set up exact .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.202'

      - name: Restore and compile x64 Release
        shell: pwsh
        run: |
          $sdk = dotnet --version
          Write-Host "Selected .NET SDK: $sdk"
          if ($sdk -ne '10.0.202') { throw "Expected .NET SDK 10.0.202, got $sdk" }
          dotnet restore ./AsantePDF.sln
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build ./AsantePDF.sln -c Release -p:Platform=x64 --no-restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run core smoke tests
        shell: pwsh
        run: |
          dotnet run --project ./tests/PdfRescue.SmokeTests/PdfRescue.SmokeTests.csproj -c Release --no-build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify normal Light-mode UI can open a PDF and stay alive
        shell: pwsh
        run: |
          $sampleDir = Join-Path $env:GITHUB_WORKSPACE 'var'
          New-Item -ItemType Directory -Force -Path $sampleDir | Out-Null
          $sample = Join-Path $sampleDir 'ui-open-sample.pdf'
          & .\scripts\New-SamplePdf.ps1 -OutputPath $sample

          $settingsRoot = Join-Path $env:LOCALAPPDATA 'AsantePDF'
          New-Item -ItemType Directory -Force -Path $settingsRoot | Out-Null
          @{
            theme = 'Light'
            defaultRenderWidth = 1100
            defaultPageView = 'SinglePage'
            reopenLastSession = $false
            trackRecentFiles = $false
            showRecentThumbnails = $false
            defaultOcrLanguage = 'eng'
            defaultOutputFolder = ''
            outputNamePattern = '{name}-{operation}'
            existingOutput = 'CreateUniqueCopy'
            recoveryEnabled = $false
            checkForUpdates = $false
            firstLaunchCompleted = $true
          } | ConvertTo-Json | Set-Content (Join-Path $settingsRoot 'settings.json') -Encoding UTF8

          $logDir = Join-Path $settingsRoot 'Logs'
          Remove-Item $logDir -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $logDir | Out-Null
          $startupLog = Join-Path $logDir 'startup.log'

          $appExe = Get-ChildItem '.\src\PdfRescue.App\bin' -Recurse -Filter 'AsantePDF.exe' -File |
            Where-Object { $_.FullName -notmatch '\\ref\\|\\publish\\' } |
            Sort-Object FullName |
            Select-Object -First 1
          if (-not $appExe) { throw 'Could not find the Release AsantePDF executable for UI-open regression testing.' }

          Write-Host "Launching normal UI from $($appExe.FullName) with $sample" -ForegroundColor Cyan
          $app = Start-Process -FilePath $appExe.FullName -ArgumentList @($sample) -PassThru
          $opened = $false
          for ($i = 0; $i -lt 80; $i++) {
            Start-Sleep -Milliseconds 250
            $app.Refresh()
            if ($app.HasExited) {
              if (Test-Path $startupLog) { Get-Content $startupLog | Write-Host }
              throw "AsantePDF exited while opening a PDF in normal Light-mode UI. Exit code: $($app.ExitCode)"
            }
            if (Test-Path $startupLog) {
              $log = Get-Content $startupLog -Raw
              if ($log -match 'Opened PDF:') { $opened = $true; break }
            }
          }
          if (-not $opened) {
            if (Test-Path $startupLog) { Get-Content $startupLog | Write-Host }
            try { if (-not $app.HasExited) { $app.Kill() } } catch { }
            throw 'Normal UI did not report a successfully opened PDF within 20 seconds.'
          }

          Start-Sleep -Seconds 3
          $app.Refresh()
          if ($app.HasExited) {
            if (Test-Path $startupLog) { Get-Content $startupLog | Write-Host }
            throw "AsantePDF opened the PDF but then exited unexpectedly. Exit code: $($app.ExitCode)"
          }
          try { $app.Kill() } catch { }
          Write-Host 'Normal Light-mode UI PDF-open regression passed.' -ForegroundColor Green

      - name: Commit validated generated changes
        shell: pwsh
        run: |
          if (-not (Test-Path 'dev-patches')) {
            Write-Host 'No generated patch changes to commit.' -ForegroundColor Cyan
            exit 0
          }

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add -A -- src tests installer assets scripts .github VERSION THIRD-PARTY-NOTICES.md .gitignore
          git rm -r dev-patches

          if (git diff --cached --quiet) {
            Write-Host 'Patch scripts produced no repository changes.' -ForegroundColor Cyan
            exit 0
          }

          git commit -m 'Apply Windows-validated AsantePDF development patch'
          git push origin HEAD:development/master-upgrade-v2
