name: AsantePDF Development Windows Gate

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - 'development/master-upgrade-v2'

permissions:
  contents: write

concurrency:
  group: asantepdf-development-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows-build:
    if: github.head_ref == 'development/master-upgrade-v2' || github.ref == 'refs/heads/development/master-upgrade-v2'
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Check out master-upgrade branch
        uses: actions/checkout@v4
        with:
          ref: development/master-upgrade-v2
          fetch-depth: 0

      - name: Apply staged development patches
        shell: pwsh
        run: |
          $patchRoot = Join-Path $env:GITHUB_WORKSPACE 'dev-patches'
          if (-not (Test-Path $patchRoot)) {
            Write-Host 'No staged development patches. Building branch as committed.' -ForegroundColor Cyan
            exit 0
          }

          $patches = Get-ChildItem $patchRoot -Filter '*.ps1' -File | Sort-Object Name
          foreach ($patch in $patches) {
            Write-Host "Applying $($patch.Name)..." -ForegroundColor Cyan
            $global:LASTEXITCODE = 0
            & $patch.FullName -SourceRoot $env:GITHUB_WORKSPACE
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Verify theme and PDFium source contracts
        shell: pwsh
        run: |
          & .\scripts\verify-ui-theme-contract.ps1
          & .\scripts\verify-pdfium-serialization.ps1

      - name: Set up exact .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.202'

      - name: Restore and compile x64 Release
        shell: pwsh
        run: |
          $sdk = dotnet --version
          Write-Host "Selected .NET SDK: $sdk"
          if ($sdk -ne '10.0.202') { throw "Expected .NET SDK 10.0.202, got $sdk" }
          dotnet restore ./AsantePDF.sln
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build ./AsantePDF.sln -c Release -p:Platform=x64 --no-restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run core smoke tests
        shell: pwsh
        run: |
          dotnet run --project ./tests/PdfRescue.SmokeTests/PdfRescue.SmokeTests.csproj -c Release --no-build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Locate Release executable
        id: appexe
        shell: pwsh
        run: |
          $appExe = Get-ChildItem '.\src\PdfRescue.App\bin' -Recurse -Filter 'AsantePDF.exe' -File |
            Where-Object { $_.FullName -notmatch '\\ref\\|\\publish\\' } |
            Sort-Object FullName |
            Select-Object -First 1
          if (-not $appExe) { throw 'Could not find the Release AsantePDF executable.' }
          "path=$($appExe.FullName)" >> $env:GITHUB_OUTPUT
          Write-Host "Using $($appExe.FullName)" -ForegroundColor Cyan

      - name: Verify Light and Dark product surfaces
        shell: pwsh
        run: |
          $settingsRoot = Join-Path $env:LOCALAPPDATA 'AsantePDF'
          New-Item -ItemType Directory -Force -Path $settingsRoot | Out-Null
          @{
            theme = 'Light'
            defaultRenderWidth = 1100
            defaultPageView = 'SinglePage'
            reopenLastSession = $true
            trackRecentFiles = $true
            showRecentThumbnails = $true
            defaultOcrLanguage = 'eng'
            defaultOutputFolder = ''
            outputNamePattern = '{name}-{operation}'
            existingOutput = 'CreateUniqueCopy'
            recoveryEnabled = $false
            checkForUpdates = $false
            firstLaunchCompleted = $true
          } | ConvertTo-Json | Set-Content (Join-Path $settingsRoot 'settings.json') -Encoding UTF8

          $output = Join-Path $env:GITHUB_WORKSPACE 'var\theme-runtime'
          Remove-Item $output -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $output | Out-Null
          $sample = Join-Path $output 'workspace-theme-sample.pdf'
          & .\scripts\New-SamplePdf.ps1 -OutputPath $sample -PageCount 12

          $app = Start-Process -FilePath '${{ steps.appexe.outputs.path }}' -ArgumentList @('--selftest-theme', $output, $sample) -Wait -PassThru
          if ($app.ExitCode -ne 0 -or -not (Test-Path (Join-Path $output 'theme-runtime-pass.flag'))) {
            $errorFile = Join-Path $output 'theme-runtime-error.txt'
            if (Test-Path $errorFile) { Get-Content $errorFile | Write-Host }
            throw "Theme runtime self-test failed with exit code $($app.ExitCode)."
          }

          foreach ($report in Get-ChildItem $output -Filter 'contrast-*.txt' | Sort-Object Name) {
            Write-Host "===== $($report.Name) =====" -ForegroundColor Cyan
            Get-Content $report.FullName | Write-Host
          }

      - name: Stress repeated normal UI PDF-open path in Light and Dark
        shell: pwsh
        run: |
          $sampleDir = Join-Path $env:GITHUB_WORKSPACE 'var'
          New-Item -ItemType Directory -Force -Path $sampleDir | Out-Null
          $sample12 = Join-Path $sampleDir 'ui-open-stress-12.pdf'
          $sample30 = Join-Path $sampleDir 'ui-open-stress-30.pdf'
          & .\scripts\New-SamplePdf.ps1 -OutputPath $sample12 -PageCount 12
          & .\scripts\New-SamplePdf.ps1 -OutputPath $sample30 -PageCount 30

          $settingsRoot = Join-Path $env:LOCALAPPDATA 'AsantePDF'
          $logDir = Join-Path $settingsRoot 'Logs'
          $startupLog = Join-Path $logDir 'startup.log'

          function Write-TestSettings([string]$theme) {
            @{
              theme = $theme
              defaultRenderWidth = 1100
              defaultPageView = 'SinglePage'
              reopenLastSession = $true
              trackRecentFiles = $true
              showRecentThumbnails = $true
              defaultOcrLanguage = 'eng'
              defaultOutputFolder = ''
              outputNamePattern = '{name}-{operation}'
              existingOutput = 'CreateUniqueCopy'
              recoveryEnabled = $false
              checkForUpdates = $false
              firstLaunchCompleted = $true
            } | ConvertTo-Json | Set-Content (Join-Path $settingsRoot 'settings.json') -Encoding UTF8
          }

          function Run-UiOpenProbe([string]$theme, [string]$pdf, [int]$expectedPages, [int]$lingerSeconds, [string]$label) {
            Write-TestSettings $theme
            Remove-Item $logDir -Recurse -Force -ErrorAction SilentlyContinue
            New-Item -ItemType Directory -Force -Path $logDir | Out-Null
            Write-Host "Starting ${label}: $theme, $expectedPages pages" -ForegroundColor Cyan
            $app = Start-Process -FilePath '${{ steps.appexe.outputs.path }}' -ArgumentList @($pdf) -PassThru
            $ready = $false
            $opened = $false
            $thumbnails = $false
            for ($i = 0; $i -lt 180; $i++) {
              Start-Sleep -Milliseconds 500
              $app.Refresh()
              if ($app.HasExited) {
                if (Test-Path $startupLog) { Get-Content $startupLog | Write-Host }
                throw "$label exited while opening. Theme=$theme Pages=$expectedPages Exit=$($app.ExitCode)"
              }
              if (Test-Path $startupLog) {
                $log = Get-Content $startupLog -Raw
                if ($log -match 'Main window loaded and ready flag written') { $ready = $true }
                if ($log -match 'Opened PDF: foreground view refresh completed') { $opened = $true }
                if ($log -match "Thumbnail rendering completed: $expectedPages pages") { $thumbnails = $true }
              }
              if ($ready -and $opened -and $thumbnails) { break }
            }
            if (-not $ready -or -not $opened -or -not $thumbnails) {
              if (Test-Path $startupLog) { Get-Content $startupLog | Write-Host }
              try { if (-not $app.HasExited) { $app.Kill() } } catch { }
              throw "$label did not complete the real open path. Theme=$theme Ready=$ready Opened=$opened Thumbnails=$thumbnails"
            }

            Start-Sleep -Seconds $lingerSeconds
            $app.Refresh()
            if ($app.HasExited) {
              if (Test-Path $startupLog) { Get-Content $startupLog | Write-Host }
              throw "$label completed the open path but then crashed. Theme=$theme Exit=$($app.ExitCode)"
            }
            try { $app.Kill() } catch { }
            Write-Host "$label passed." -ForegroundColor Green
          }

          foreach ($theme in @('Light','Dark')) {
            for ($round = 1; $round -le 3; $round++) {
              Run-UiOpenProbe $theme $sample12 12 4 "$theme 12-page repetition $round"
            }
            Run-UiOpenProbe $theme $sample30 30 8 "$theme 30-page stress"
          }

      - name: Upload runtime theme evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AsantePDF-theme-runtime-evidence
          path: var/theme-runtime/**
          if-no-files-found: warn
          retention-days: 14

      - name: Commit validated generated changes
        shell: pwsh
        run: |
          if (-not (Test-Path 'dev-patches')) {
            Write-Host 'No generated patch changes to commit.' -ForegroundColor Cyan
            exit 0
          }

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- src tests installer assets scripts VERSION THIRD-PARTY-NOTICES.md .gitignore
          git rm -rf dev-patches

          if (git diff --cached --quiet) {
            Write-Host 'Patch scripts produced no repository changes.' -ForegroundColor Cyan
            exit 0
          }

          git commit -m 'Apply Windows-validated AsantePDF development patch'
          git push origin HEAD:development/master-upgrade-v2
