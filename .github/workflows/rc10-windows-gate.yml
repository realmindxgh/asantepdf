name: AsantePDF Development Windows Gate

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  windows-build:
    if: github.head_ref == 'development/master-upgrade-v2'
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out master-upgrade branch
        uses: actions/checkout@v4
        with:
          ref: development/master-upgrade-v2
          fetch-depth: 0

      - name: Materialize staged product-shell XAML
        shell: pwsh
        run: |
          $payload = Join-Path $env:GITHUB_WORKSPACE 'ui-payload\MainWindow.xaml.gz.b64'
          if (-not (Test-Path $payload)) {
            Write-Host 'No staged MainWindow payload. Building branch as committed.' -ForegroundColor Cyan
            exit 0
          }

          $base64 = (Get-Content $payload -Raw).Trim()
          $compressed = [Convert]::FromBase64String($base64)
          $input = [IO.MemoryStream]::new($compressed)
          $gzip = [IO.Compression.GZipStream]::new($input, [IO.Compression.CompressionMode]::Decompress)
          $output = [IO.MemoryStream]::new()
          try {
            $gzip.CopyTo($output)
          }
          finally {
            $gzip.Dispose()
            $input.Dispose()
          }
          $target = Join-Path $env:GITHUB_WORKSPACE 'src\PdfRescue.App\MainWindow.xaml'
          [IO.File]::WriteAllBytes($target, $output.ToArray())
          $output.Dispose()
          Write-Host "Materialized redesigned MainWindow.xaml ($((Get-Item $target).Length) bytes)." -ForegroundColor Green

      - name: Set up exact .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.202'

      - name: Restore and compile x64 Release
        shell: pwsh
        run: |
          $sdk = dotnet --version
          Write-Host "Selected .NET SDK: $sdk"
          if ($sdk -ne '10.0.202') { throw "Expected .NET SDK 10.0.202, got $sdk" }
          dotnet restore ./AsantePDF.sln
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build ./AsantePDF.sln -c Release -p:Platform=x64 --no-restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run core smoke tests
        shell: pwsh
        run: |
          dotnet run --project ./tests/PdfRescue.SmokeTests/PdfRescue.SmokeTests.csproj -c Release --no-build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Commit validated staged shell
        shell: pwsh
        run: |
          $payload = 'ui-payload/MainWindow.xaml.gz.b64'
          if (-not (Test-Path $payload)) {
            Write-Host 'No staged shell to commit.' -ForegroundColor Cyan
            exit 0
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/PdfRescue.App/MainWindow.xaml
          git rm $payload
          git commit -m 'Implement Architecture Batch 1 product shell'
          git push origin HEAD:development/master-upgrade-v2
